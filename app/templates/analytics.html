{% extends "base.html" %}

{% block content %}

<h2>Big Data Analytics Dashboard</h2>

<div class="card">
    <h3>Total Waste Records</h3>
    <h1>{{ total_records }}</h1>
</div>

<div class="card">
    <h3>Waste Category Analysis</h3>
    <canvas id="categoryChart"></canvas>
</div>

<div class="card">
    <h3>Manual Review Status</h3>
    <canvas id="statusChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const categoryLabels = {{ category_labels | tojson }};
    const categoryValues = {{ category_values | tojson }};

    const statusLabels = {{ status_labels | tojson }};
    const statusValues = {{ status_values | tojson }};

    new Chart(document.getElementById("categoryChart"), {
        type: "bar",
        data: {
            labels: categoryLabels,
            datasets: [{
                label: "Waste Records",
                data: categoryValues
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        precision: 0
                    }
                }
            }
        }
    });

    new Chart(document.getElementById("statusChart"), {
        type: "doughnut",
        data: {
            labels: statusLabels,
            datasets: [{
                label: "Review Status",
                data: statusValues
            }]
        },
        options: {
            responsive: true
        }
    });
</script>

{% endblock %}
